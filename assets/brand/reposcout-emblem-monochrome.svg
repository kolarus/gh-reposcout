<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- One-colour emblem for Android themed icons and iOS tinted icons: the badge disc is dropped and the lens is a ring, so the branch inside stays visible. Same geometry as reposcout-emblem.svg. -->
<defs>
<mask id="hat-band">
<rect x="-200" y="-120" width="400" height="200" fill="#fff"/>
<rect x="-62" y="-20" width="124" height="16" rx="3" fill="#000"/>
</mask>
</defs>
<g transform="translate(230 250) scale(1.75)" fill="none" stroke="#fff" stroke-linecap="round">
<line x1="44" y1="44" x2="80" y2="80" stroke-width="26"/>
<circle cx="0" cy="0" r="62" stroke-width="16"/>
<line x1="-14" y1="-28" x2="-14" y2="30" stroke-width="8"/>
<path d="M20 -18 Q20 8 -14 16" stroke-width="8"/>
</g>
<g transform="translate(230 250) scale(1.75)" fill="#fff">
<circle cx="-14" cy="-28" r="9"/>
<circle cx="-14" cy="30" r="9"/>
<circle cx="20" cy="-22" r="9"/>
</g>
<g transform="translate(206 138) rotate(-14) scale(0.95)" fill="#fff" mask="url(#hat-band)">
<ellipse cx="0" cy="0" rx="136" ry="24"/>
<path d="M-64 0 L-42 -64 Q0 -84 42 -64 L64 0 Z"/>
</g>
</svg>
