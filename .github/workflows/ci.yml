# JS checks + Android build on every push to main (ADR-0016). No PRs: the
# owner commits straight to main and fixes a red run first (ADR-0024).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, checks, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: yarn validate
        run: yarn validate

  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The Gradle build/cache report is only worth reading when something broke.
          add-job-summary: on-failure
      - name: Assemble debug APK
        working-directory: android
        # One ABI is enough to prove the native build compiles.
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64
