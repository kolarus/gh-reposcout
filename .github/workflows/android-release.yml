# Release (ADR-0016): a `v*` tag builds the signed Android APKs (universal and
# arm64-v8a), checks their signature and 16 KB page alignment, writes
# checksums, records build provenance and publishes a GitHub Release. Only this
# job can read the signing secrets: they live in the `release` Environment,
# which accepts `v*` tags only.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Run yarn release:prepare first."
            exit 1
          fi
          # Hand-written notes, shared by a version's release candidates.
          notes="docs/releases/${version%%-*}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "notes=$notes"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          add-job-summary: on-failure

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The release Environment has no ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the APKs
        working-directory: android
        env:
          REPOSCOUT_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.keystore
          REPOSCOUT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REPOSCOUT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REPOSCOUT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPOSCOUT_VERSION_CODE: ${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          # Universal: every CPU type, installs anywhere (emulators included).
          ./gradlew app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../dist/RepoScout-$VERSION-universal.apk"
          # arm64-v8a: a fraction of the size, fits virtually every modern phone.
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "../dist/RepoScout-$VERSION-arm64-v8a.apk"

      - name: Check signature and 16 KB alignment
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            certs=$("$tools/apksigner" verify --print-certs "$apk")
            # Without the secrets, Gradle falls back to the debug key: never ship that.
            if grep -q "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
            "$tools/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          done
          {
            echo "### Signing certificate"
            echo '```'
            grep -E "certificate (DN|SHA-256 digest)" <<<"$certs"
            echo '```'
            echo "### APKs"
            ls -l dist/*.apk | awk '{ printf "- %s: %.1f MB\n", $9, $5 / 1048576 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.apk'

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "RepoScout $VERSION" --notes-file "$NOTES" "${flags[@]}"

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
